[build]
  publish = "."

# Netlify only serves PR previews and a *.netlify.app copy of the site, so keep them out of
# search. The real domain is served by GitHub Pages, which ignores this file.
# Remove this block if the custom domain ever moves to Netlify.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# The README and CLAUDE.md are for people reading the repository, not the site, so
# don't serve them here. A forced 404 rule hides a file that is still in the published folder.
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true
